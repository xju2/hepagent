[project]
name = "hepagent"
version = "0.3.4"
description = "Agent AI for HEP tasks"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["hep", "cosmology", "agents"]
authors = [
  {name = "X. Ju", email = "xju@lbl.gov" }
]
dependencies = [
    "camb>=1.6.5",
    "cernopendata-client>=1.0.2",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "openai-agents[litellm]>=0.6.3",
    "prompt_toolkit>=3.0.52",
    "pyyaml>=6.0.3",
    "textual>=6.11.0",
    "typer>=0.24.1",
]

[project.urls]
Homepage = "https://github.com/xju2/hepagent"


[project.scripts]
hepagent = "hepagent.main:app"

[project.optional-dependencies]
tracing = [
    "mlflow>=3.10.0",
]
iri = [
    "globus-sdk>=4.4.1",
    "iri-client>=0.1.4",
]

[dependency-groups]
dev = [
    "coverage>=7.13.4",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14.10",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hepagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*ipynb", "testarea/*"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
isort = { combine-as-imports = true, known-first-party = ["agents"] }

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E501"]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["src/hepagent"]
omit = ["tests/*", "src/hepagent/scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"
exclude_also = [
    # This is only executed while typechecking
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "logger.debug",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    # This is a warning that is expected to happen: we have an async filter that raises an exception
    "ignore:coroutine 'test_async_input_filter_fails.<locals>.invalid_input_filter' was never awaited:RuntimeWarning",
]
markers = [
    "allow_call_model_methods: mark test as allowing calls to real model implementations",
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"
