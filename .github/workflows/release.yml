name: Release and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release (e.g. v0.3.2)'
        required: true

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1. Build the package
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build

      # 2. Create the GitHub Release
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: HepAgent ${{ github.event.inputs.tag }}
          body_path: CHANGELOG.md

      # 3. Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          username: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
