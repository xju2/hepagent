    condition.max_iterations,
    (v) => { condition.max_iterations = parseInt(v, 10) || 1; render(); }, "number");
  choice(side, "When the budget runs out", condition.on_exhaustion, EXHAUSTION,
    (v) => { condition.on_exhaustion = v; });
  side.appendChild(hint(
    condition.on_exhaustion === "escalate"
      ? "Stops the run for a human rather than choosing a branch."
      : `Takes the ${condition.on_exhaustion} branch and carries on.`));

  const hasMetric = !!condition.metric;
  toggle(side, "Decide from a number in a results file", hasMetric, (v) => {
    condition.metric = v
      ? { source: "", key: "", compare: "improvement_below", value: 0 }
      : null;
    renderSide();
  });

  if (hasMetric) {
    const metric = condition.metric;
    field(side, "Results file (relative to the analysis root)", metric.source,
      (v) => { metric.source = v; });
    field(side, "Key (dotted path into the JSON)", metric.key, (v) => { metric.key = v; });
    choice(side, "Comparison", metric.compare, COMPARISONS, (v) => {
      metric.compare = v; renderSide();
    });
    field(side, "Threshold", metric.value,
      (v) => { metric.value = parseFloat(v) || 0; }, "number");
    side.appendChild(hint(
      metric.compare.startsWith("improvement")
        ? "Compares the change since the previous pass — the convergence test."
        : "Compares the value itself against the threshold."));
  }

  field(side, "Question (used when there is no readable metric)", condition.question,
    (v) => { condition.question = v; }, "textarea");
  side.appendChild(hint(
    "Judged by an agent that reads the upstream artifacts and answers yes or no. "
    + "Leave both empty and the loop always runs to its budget."));
}

function renderEdgePanel(side, edge, index) {
  if (!edge) { sel = null; return renderSide(); }
  side.appendChild(heading("Edge"));
  const p = document.createElement("p");
  p.className = "hint";
  p.textContent = `${edge.upstream} → ${edge.downstream}`;
  side.appendChild(p);

  choice(side, "Kind", edge.kind, KINDS, (v) => { edge.kind = v; render(); });
  side.appendChild(hint(edgeKindHint(edge)));

  choice(side, "Injection", edge.inject, INJECTS, (v) => { edge.inject = v; });
  side.appendChild(hint(
    edge.inject === "none"
      ? "Ordering only — the artifact is not put into the prompt."
      : edge.inject === "summary"
        ? "Only the opening of the artifact reaches the prompt."
        : "The whole artifact reaches the prompt."));

  const remove = document.createElement("button");
  remove.className = "danger";
  remove.textContent = "Delete this edge";
  remove.style.marginTop = "12px";
  remove.addEventListener("click", () => {
    plan.edges.splice(index, 1);
    sel = null; markDirty(); render(); renderSide();
  });
  side.appendChild(remove);
}

function edgeKindHint(edge) {
  if (edge.kind === "informs") {
    return "Context only: the downstream node does not wait for this.";
  }
  if (!isBranch(edge)) {
    return "Blocking: the downstream node cannot start until this one passes review.";
  }
  const answer = edge.kind === "on_true" ? "holds" : "does not hold";
  const source = nodeById(edge.upstream);
  if (source && source.kind !== "condition") {
    return `Only a condition node may branch — “${edge.upstream}” is not one.`;
  }
  return backBranches().has(edge)
    ? `Loops: when the condition ${answer}, the analysis rewinds to `
      + `“${edge.downstream}” and re-runs from there.`
    : `Routes forward to “${edge.downstream}” when the condition ${answer}. `
      + "The other branch is skipped.";
}

/* ------------------------------------------------------------- findings */

function renderFindings() {
  const box = $("findings");
  box.textContent = "";
  if (!findings.length) {
    const clean = document.createElement("div");
    clean.className = "clean";
    clean.textContent = "No findings. This plan is internally consistent.";
    box.appendChild(clean);
    return;
  }
  for (const f of findings) {
    const row = document.createElement("div");
    row.className = `f ${f.severity}`;
    const rule = document.createElement("code");
    rule.textContent = f.rule + (f.node_id ? ` [${f.node_id}]` : "");
    row.appendChild(rule);
    row.appendChild(document.createTextNode(" " + f.message));
    if (f.node_id) {
      row.style.cursor = "pointer";
      row.addEventListener("click", () => select("node", f.node_id));
    }
    box.appendChild(row);
  }
}

/* --------------------------------------------------------------- actions */

function applyView(view) {
  plan = view.plan;
  layout = view.layout || {};
  findings = view.findings || [];
  blocking = !!view.blocking;
  approved = !!view.approved;
  catalog = view.catalog || {};
  dirty = false;
  $("title").textContent = `${plan.name} — analysis plan`;
  $("subtitle").textContent =
    `${plan.analysis_type} · ${plan.nodes.length} nodes · rev ${plan.revision}` +
    (plan.template ? ` · ${plan.template}` : "");
  render(); renderSide(); renderFindings(); renderState();
}

async function load() {
  const res = await fetch(API);
  if (!res.ok) {
    toast(`Could not load the plan: ${res.status} ${await res.text()}`, true);
    return;
  }
  applyView(await res.json());
}

async function save() {
  const res = await fetch(API, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ plan }),
  });
  if (!res.ok) {
    toast(`Save failed: ${(await res.json()).detail || res.status}`, true);
    return false;
  }
  promptHistory = null;   // a save may have added a wording to it
  applyView(await res.json());
  toast(`Saved revision ${plan.revision}.`);
  return true;
}

async function approve() {
  if (dirty && !(await save())) return;
  const res = await fetch(`${API}/approve`, { method: "POST" });
  if (!res.ok) {
    toast(`Not approved: ${(await res.json()).detail || res.status}`, true);
    return;
  }
  const view = await res.json();
  applyView(view);
  // `awaited` says a run is already blocked on this latch — `jfc run
  // --review-plan` — and approving has just released it. Starting another here
  // would run the same analysis twice.
  if (view.awaited) {
    toast("Approved. The waiting run is starting.");
    startPolling();
    return;
  }
  await startRun();
}

/* -------------------------------------------------------------------- run */

function runClass(nodeId) {
  const status = runNodes[nodeId];
  return status ? `run-${status}` : "";
}

async function startRun(onlyNode) {
  const body = {
    unattended: Boolean($("run-unattended").checked),
    model: $("run-model").value.trim() || null,
    max_iterations: parseInt($("run-iterations").value, 10) || 3,
    // Blank means "defer to each role's default", which the server reads as null
    // — 0 would be a turn cap of zero, so an unparseable value must not become one.
    max_turns: parseInt($("run-turns").value, 10) || null,
  };
  if (onlyNode) body.only_node = onlyNode;
  const res = await fetch(`${API}/run`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    toast(`Could not start the run: ${(await res.json()).detail || res.status}`, true);
    return;
  }
  runSeq = 0;
  applyRun(await res.json());
  toast(onlyNode
    ? `Running “${onlyNode}” on its own. Questions from the agents appear here.`
    : "The analysis is running. Questions from the agents appear here.");
  startPolling();
}

/* The node panel's Run button. Unlike Approve it does not release the plan:
   running one node is a statement about that node, not about the pipeline. It
   still saves first, because what runs is the plan on disk. */
async function runNode(id) {
  // Silence here read as a dead button; the run in flight owns the analysis.
  if (runActive()) {
    toast("A run is already in progress \u2014 stop it before running a node.", true);
    return;
  }
  if (dirty && !(await save())) return;
  await startRun(id);
}

async function cancelRun() {
  const res = await fetch(`${API}/run/cancel`, { method: "POST" });
  if (!res.ok) {
    toast(`Could not stop the run: ${(await res.json()).detail || res.status}`, true);
    return;
  }
  applyRun(await res.json());
  toast("Stopping after the current node finishes.");
}

async function pollRun() {
  pollTimer = null;
  let snapshot = null;
  try {
    const res = await fetch(`${API}/run?since=${runSeq}`);
    if (res.ok) snapshot = await res.json();
  } catch (err) {
    // A dropped connection is not a dead run: keep polling.
  }
  try {
    if (snapshot) applyRun(snapshot);
  } finally {
    // An exception while drawing is a page bug, not a finished run: keep asking.
    if (runActive()) startPolling();
  }
}

function startPolling() {
  if (pollTimer !== null) return;
  pollTimer = setTimeout(pollRun, POLL_MS);
}

function applyRun(snapshot) {
  if (!snapshot || !snapshot.status) return;
  const wasActive = runActive();
  run = snapshot;
  if (typeof snapshot.latest_seq === "number") runSeq = Math.max(runSeq, snapshot.latest_seq);

  const before = JSON.stringify(runNodes);
  runNodes = snapshot.nodes || {};
  const events = snapshot.events || [];
  appendRunEvents(events);
  // Something moved, so what the analysis knows may have moved with it. Tying
  // the refresh to progress rather than to a second timer means a finished run
  // stops costing anything, and a busy one keeps the panel current.
  //
  // A *node boundary* only. The agents now narrate every turn and every tool
  // call, and re-reading the graph and the process inventory once per poll for
  // the whole length of a run is a cost the Progress tab does not earn: what
  // the analysis has established changes when a node moves, not when a command
  // runs.
  const moved = events.some((e) => (e.kind || "progress") === "progress");
  if (moved || JSON.stringify(runNodes) !== before) loadState();
  renderRun();
  renderState();
  // The question comes first: the run is stopped until it is answered, so a
  // failure anywhere in the drawing below must not be able to swallow it.
  renderAsk(snapshot.prompt);
  // Re-drawing on every poll would fight a drag in progress, so the picture is
  // rebuilt only when a node actually changed colour.
  if (JSON.stringify(runNodes) !== before) render();
  if (wasActive && !runActive() && snapshot.status !== "idle") {
    toast(snapshot.status === "done"
      ? `Analysis complete: ${snapshot.result || "finished"}`
      : `Run ${snapshot.status}: ${(snapshot.error || "").split("\n")[0]}`,
      snapshot.status !== "done");
  }
}

/* How many rows the log keeps in the DOM. The run itself keeps far more (see
   `plan/runs.py`), but a browser asked to lay out tens of thousands of rows
   stops being a place anyone wants to watch a run from. */
const LOG_MAX_ROWS = 4000;

/* Autoscroll only when the reader is already at the bottom. Someone who has
   scrolled up is reading something, and yanking them back down every two
   seconds is how a live log becomes unusable. */
const LOG_STICK_PX = 40;

/* One row per step. Steps that carry a body are <details>, so the body is one
   click away instead of on the terminal that launched the server. */
function runEventRow(event) {
  const kind = event.kind || "progress";
  const hasDetail = Boolean((event.detail || "").trim());
  const row = document.createElement(hasDetail ? "details" : "div");
  row.className = `e ${event.level || "info"} k-${kind}`;

  const head = hasDetail ? document.createElement("summary") : row;
  const where = document.createElement("code");
  where.textContent = event.node;
  head.appendChild(where);
  const who = document.createElement("span");
  who.className = "who";
  who.textContent = event.agent || "";
  head.appendChild(who);
  const msg = document.createElement("span");
  msg.className = "msg";
  msg.textContent = event.message;
  head.appendChild(msg);

  if (hasDetail) {
    row.appendChild(head);
    const body = document.createElement("pre");
    body.textContent = event.detail;
    row.appendChild(body);
  }
  return row;
}

function appendRunEvents(events) {
  if (!events.length) return;
  const log = $("run-log");
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < LOG_STICK_PX;
  for (const event of events) log.appendChild(runEventRow(event));
  while (log.childElementCount > LOG_MAX_ROWS) log.removeChild(log.firstElementChild);
  if (stick) log.scrollTop = log.scrollHeight;
}

function renderRun() {
  const box = $("run");
  if (!run || run.status === "idle") { box.hidden = true; freezeRunSettings(false); return; }
  box.hidden = false;
  const pill = $("run-state");
  pill.textContent = run.status;
  pill.className = "pill " + (
    run.status === "done" ? "approved"
    : run.status === "blocked" ? "blocked"
    : run.status === "failed" || run.status === "cancelled" ? "failed" : "run");
  const done = Object.values(runNodes).filter((s) => s === "done").length;
  $("run-detail").textContent = plan
    ? `${done}/${plan.nodes.length} nodes complete` + (run.unattended ? " · unattended" : "")
    : "";
  freezeRunSettings(runActive());
}

/* The settings describe the *next* launch, so they are editable until there is
   a run and again once it ends. Stop belongs to the run itself. */
function freezeRunSettings(active) {
  $("cancel-run").disabled = !active;
  for (const id of ["run-unattended", "run-model", "run-iterations", "run-turns"]) {
    $(id).disabled = active;
  }
}

/* The one place a running analysis talks back to its human: bash approvals,
   `ask_user_for_info` and the human gate all arrive here as a pending prompt. */
function renderAsk(prompt) {
  const box = $("ask");
  // An answered prompt can still appear in the very next snapshot — the run
  // thread clears it a moment after the answer is delivered — so the id is
  // remembered rather than trusted to disappear, and the dialog does not flicker
  // back on top of a user who has already dealt with it.
  if (!prompt || answered.has(prompt.id)) { box.hidden = true; return; }
  if (shownPrompt === prompt.id) return;  // already showing it
  shownPrompt = prompt.id;
  box.hidden = false;
  answering = false;

  const approval = prompt.kind === "approval";
  $("ask-title").textContent = approval ? "Run this command?" : "The analysis has a question";
  $("ask-text").textContent = approval ? (prompt.cwd ? `Working directory: ${prompt.cwd}` : "")
                                       : prompt.text;
  $("ask-cmd").hidden = !approval;
  $("ask-cmd").textContent = prompt.cmd || "";
  $("ask-thought").textContent = prompt.thought ? `Why: ${prompt.thought}` : "";
  const input = $("ask-input");
  input.value = "";
  input.hidden = approval;
  input.placeholder = approval ? "" : "Your answer";

  const actions = $("ask-actions");
  actions.textContent = "";
  if (approval) {
    actions.appendChild(askButton("✅ Approve", "primary",
      () => answerAsk(prompt.id, { approved: true })));
    actions.appendChild(askButton("✋ Reject", "danger", () => {
      // The reason goes back to the agent, so it can choose differently.
      input.hidden = false;
      input.placeholder = "Why are you rejecting it? (sent to the agent)";
      actions.textContent = "";
      actions.appendChild(askButton("Send rejection", "danger",
        () => answerAsk(prompt.id, { approved: false, reason: input.value })));
    }));
  } else {
    for (const choice of prompt.choices || []) {
      actions.appendChild(askButton(choice, "primary",
        () => answerAsk(prompt.id, { text: choice })));
    }
    actions.appendChild(askButton("Send", (prompt.choices || []).length ? "" : "primary",
      () => answerAsk(prompt.id, { text: input.value })));
  }
}

function askButton(label, cls, onClick) {
  const button = document.createElement("button");
  button.textContent = label;
  if (cls) button.className = cls;
  button.addEventListener("click", onClick);
  return button;
}

async function answerAsk(promptId, payload) {
  if (answering) return;
  answering = true;
  answered.add(promptId);
  const res = await fetch(`${API}/run/answer`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ id: promptId, since: runSeq }, payload)),
  });
  if (!res.ok) {
    answering = false;
    answered.delete(promptId);
    toast(`Answer not accepted: ${(await res.json()).detail || res.status}`, true);
    return;
  }
  $("ask").hidden = true;
  shownPrompt = null;
  applyRun(await res.json());
  startPolling();
}

function addNode() {
  const base = "node";
  let n = 1, id = base + n;
  while (nodeById(id)) id = base + (++n);
  const spot = freePosition();
  plan.nodes.push({
    id, label: `Node ${n}`, directory: id, artifact: `${id.toUpperCase()}.md`,
    prompt: "Describe what this node must produce.\n",
    kind: "work", role: "executor", reviewers: ["critical"], arbiter: false,
    produces_note: false, note_artifact: "", context_paths: [], gates: [],
    contract: { node_types: [], edge_types: [] },
    condition: null,
    max_iterations: 3, model: null, tools: null, skills: [], mcp_servers: [],
    // Placed explicitly: a node the server has never seen is in no layout, and
    // the fallback would stack it on the first node.
    metadata: { x: spot.x, y: spot.y },
  });
  markDirty(); select("node", id); scrollIntoView(spot);
}

function addCondition() {
  const base = "check";
  let n = 1, id = base + n;
  while (nodeById(id)) id = base + (++n);
  const spot = freePosition();
  plan.nodes.push({
    id, label: `Check ${n}`, directory: id, artifact: `${id.toUpperCase()}.md`,
    prompt: "",
    kind: "condition", role: "executor", reviewers: [], arbiter: false,
    produces_note: false, note_artifact: "", context_paths: [], gates: [],
    contract: { node_types: [], edge_types: [] },
    condition: { question: "", metric: null, max_iterations: 3, on_exhaustion: "true" },
    max_iterations: 3, model: null, tools: null, skills: [], mcp_servers: [],
    metadata: { x: spot.x, y: spot.y },
  });
  markDirty(); select("node", id); scrollIntoView(spot);
}

/* ------------------------------------------------- predefined node library */

/* What the server offers to insert, fetched once on first open: a catalog of
   whole nodes — prompt, reviewers, gates, contract — lifted out of the built-in
   pipelines. The point is that a hand-built plan does not have to retype a
   phase the shipped pipeline already spells out. */
let library = null;
let libraryFilter = "";

async function openLibrary() {
  $("library").hidden = false;
  $("library-search").value = libraryFilter;
  if (library === null) {
    renderLibrary("Loading…");
    const res = await fetch(`${API}/predefined`);
    if (!res.ok) {
      library = [];
      toast(`Could not load predefined nodes: ${(await res.json()).detail || res.status}`, true);
    } else {
      library = (await res.json()).nodes || [];
    }
  }
  renderLibrary();
}

function closeLibrary() { $("library").hidden = true; }

function libraryMatches(entry) {
  if (!libraryFilter) return true;
  const hay = [entry.node.label, entry.node.id, entry.source, entry.summary]
    .join(" ").toLowerCase();
  return hay.includes(libraryFilter.toLowerCase());
}

function renderLibrary(message) {
  const list = $("library-list");
  list.textContent = "";
  if (message || library === null) {
    const note = document.createElement("p");
    note.className = "empty";
    note.textContent = message || "Loading…";
    list.appendChild(note);
    return;
  }
  const shown = library.filter(libraryMatches);
  if (!shown.length) {
    const note = document.createElement("p");
    note.className = "empty";
    note.textContent = library.length
      ? "No predefined node matches that."
      : "This installation ships no predefined nodes.";
    list.appendChild(note);
    return;
  }
  let group = null;
  for (const entry of shown) {
    if (entry.source !== group) {
      group = entry.source;
      const head = document.createElement("div");
      head.className = "group";
      head.textContent = entry.source_description
        ? `${entry.source} — ${entry.source_description}` : entry.source;
      list.appendChild(head);
    }
    const row = document.createElement("button");
    row.className = "row";
    row.title = "Insert a copy of this node";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = entry.node.label || entry.node.id;
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = [entry.node.id, entry.summary].filter(Boolean).join(" · ");
    row.appendChild(name);
    row.appendChild(meta);
    row.addEventListener("click", () => insertPredefined(entry));
    list.appendChild(row);
  }
}

/* Insert a copy. The id and the working directory are made unique against the
   plan rather than reused: two nodes sharing a directory write their artifacts
   over each other, and the validator refuses a duplicate id outright. */
function insertPredefined(entry) {
  const node = JSON.parse(JSON.stringify(entry.node));
  let n = 1, id = node.id;
  while (nodeById(id)) id = `${node.id}_${++n}`;
  node.id = id;
  let directory = n > 1 ? `${node.directory}_${n}` : node.directory;
  let suffix = n;
  while (plan.nodes.some((other) => other.directory === directory)) {
    directory = `${node.directory}_${++suffix}`;
  }
  node.directory = directory;
  const spot = freePosition();
  node.metadata = Object.assign({}, node.metadata, { x: spot.x, y: spot.y });
  plan.nodes.push(node);
  closeLibrary();
  markDirty(); select("node", node.id); scrollIntoView(spot);
  toast(`Inserted “${node.label || node.id}” from ${entry.source}.`);
  return node;
}

function onConnectClick(id) {
  if (connecting === "arm") {
    connecting = { from: id };
    toast(`Connecting from “${id}” — now click the downstream node.`);
    return;
  }
  const from = connecting.from;
  connecting = null;
  $("connect").classList.remove("on");
  if (from === id) { toast("A node cannot depend on itself.", true); return; }
  if (plan.edges.some((e) => e.upstream === from && e.downstream === id)) {
    toast("That edge already exists.", true); return;
  }
  plan.edges.push({ upstream: from, downstream: id, kind: "requires", inject: "full",
                    metadata: {} });
  markDirty(); render();
  select("edge", plan.edges.length - 1);
}

async function relayout() {
  // Ask the server to lay out what is *on screen*. Dropping the stored x/y and
  // falling back to the layout that arrived with the last view only worked
  // until the plan changed: nodes added since were in no layout at all and
  // piled up on the origin, which is why this looked like it did nothing until
  // a save went round the same algorithm.
  const res = await fetch(`${API}/layout`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ plan }),
  });
  if (!res.ok) {
    toast(`Auto-layout failed: ${(await res.json()).detail || res.status}`, true);
    return;
  }
  const grid = (await res.json()).layout || {};
  layout = grid;
  for (const node of plan.nodes) {
    const [column, row] = grid[node.id] || [0, 0];
    setPosition(node, columnX(column), PAD + row * ROW);
  }
  // The prompt goes back to the head of the picture with them.
  plan.metadata = Object.assign({}, plan.metadata, { prompt_x: null, prompt_y: null });
  markDirty(); render();
  $("canvas-wrap").scrollLeft = 0;
  $("canvas-wrap").scrollTop = 0;
  toast("Nodes rearranged by dependency depth. Save to keep it.");
}

/* ------------------------------------------------------------- progress */

/* The dock's Progress tab: what the analysis has established, as opposed to
   what it is doing. Everything drawn here is derived server-side from the
   analysis directory (`GET .../state`), so it is correct for a plan that has
   never run, and it survives both a reload and a server restart. */

function htm(tag, cls, textValue) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (textValue !== undefined && textValue !== null) node.textContent = String(textValue);
  return node;
}

async function loadState() {
  try {
    const res = await fetch(`${API}/state`);
    if (!res.ok) return;
    state = await res.json();
  } catch (err) {
    return;  // the panel is a view, not a control: a failed poll changes nothing
  }
  renderProgress();
}

/* How tall the dock is. Kept in a CSS variable so both tab bodies follow it,
   and in localStorage so the choice survives a reload — a physicist who wants
   the graph big and the log small should not have to say so twice.

   Storage is optional on purpose: a page served from a file:// URL or a locked
   down profile has no localStorage, and the dock still resizes there. */
const DOCK_MIN = 60, DOCK_DEFAULT = 240, DOCK_KEY = "hepagent.plan.dockHeight";

function dockMax() {
  return Math.max(DOCK_MIN, (window.innerHeight || 800) - 220);
}

function storedDockHeight() {
  try {
    const saved = Number(localStorage.getItem(DOCK_KEY));
    return saved > 0 ? saved : 0;
  } catch (err) {
    return 0;  // no storage available; the default is not worth an error
  }
}

/* The height the page believes in, rather than the height the layout happens to
   report: reading it back off an element would round-trip through whatever the
   flexbox did with it, and a drag that fought its own measurement is the bug
   this avoids. */
let dockHeight = DOCK_DEFAULT;

function setDockHeight(px, remember) {
  dockHeight = Math.round(Math.min(dockMax(), Math.max(DOCK_MIN, px)));
  $("dock").style.setProperty("--dock-h", `${dockHeight}px`);
  if (remember) {
    try { localStorage.setItem(DOCK_KEY, String(dockHeight)); } catch (err) { /* ignore */ }
  }
  return dockHeight;
}

/* Dragging the grip resizes both bodies at once. The pointer is captured, so a
   fast drag that leaves the 7px strip keeps resizing instead of stopping dead. */
function startDockResize(ev) {
  if (ev.button) return;
  const grip = $("dock-grip");
  const startY = ev.clientY;
  const startHeight = dockHeight;
  $("dock").classList.add("resizing");
  grip.setPointerCapture(ev.pointerId);
  ev.preventDefault();

  const move = (move_ev) => setDockHeight(startHeight + (startY - move_ev.clientY), false);
  const stop = () => {
    grip.removeEventListener("pointermove", move);
    grip.removeEventListener("pointerup", stop);
    grip.removeEventListener("pointercancel", stop);
    $("dock").classList.remove("resizing");
    setDockHeight(dockHeight, true);
  };
  grip.addEventListener("pointermove", move);
  grip.addEventListener("pointerup", stop);
  grip.addEventListener("pointercancel", stop);
}

function showTab(name) {
  tab = name;
  $("tab-progress").classList.toggle("on", name === "progress");
  $("tab-log").classList.toggle("on", name === "log");
  $("progress").hidden = name !== "progress";
  $("run-log").hidden = name !== "log";
  $("log-filter").hidden = name !== "log";
}

/* The filter is a class on the container, not a re-render: every event is
   already in the DOM and re-building thousands of rows on a dropdown change
   would drop the reader's scroll position along with them. */
function applyLogFilter() {
  const log = $("run-log");
  const stick = log.scrollHeight - log.scrollTop - log.clientHeight < LOG_STICK_PX;
  log.classList.remove("only-commands", "only-phases");
  const mode = $("log-filter").value;
  if (mode && mode !== "all") log.classList.add(mode);
  if (stick) log.scrollTop = log.scrollHeight;
}

/* One pill per plan node. A node is "produced" when its artifact is on disk,
   which is a claim about the filesystem; the live run status, when there is
   one, wins over it, because a node being re-run is not a finished node. */
function renderSteps(parent) {
  const strip = htm("div", "steps");
  for (const node of (state && state.nodes) || []) {
    const live = runNodes[node.id];
    const status = live || (node.produced ? "produced" : "");
    const pill = htm("span", `step ${status === "done" ? "produced" : status}`);
    pill.appendChild(htm("span", "dot"));
    pill.appendChild(htm("span", null, node.label || node.id));
    if (node.figures) pill.appendChild(htm("span", "imp", `${node.figures} fig`));
    pill.title = node.artifact + (node.produced ? " — written" : " — not written yet");
    strip.appendChild(pill);
  }
  parent.appendChild(strip);
}

const SECTION_TITLES = {
  signal: "Signal",
  irreducible: "Irreducible background",
  reducible: "Reducible background",
  instrumental: "Instrumental background",
  data: "Observed data",
};

/* The strategy's answer to "what are we modelling, and out of what files".
   Empty sections are drawn too: a strategy that identified no instrumental
   background has said something, and hiding the heading hides the claim. */
function renderProcesses(parent) {
  const processes = (state && state.processes) || {};
  const heading = htm("h3", null, "Processes and datasets");
  if (processes.recorded) {
    const count = (processes.datasets || []).length;
    heading.appendChild(htm("span", "meta",
      `  ${processes.count} processes · ${count} datasets · from ${processes.node_id}`));
  }
  parent.appendChild(heading);

  if (!processes.recorded) {
    parent.appendChild(htm("p", "hint",
      "Not established yet. The strategy step decides the signal, classifies each " +
      "background as irreducible, reducible or instrumental, and records the datasets " +
      "carrying each — they appear here as it does."));
    return;
  }

  const groups = htm("div", "groups");
  for (const section of processes.sections || []) {
    const box = htm("div", `group ${section.name}`);
    const title = htm("div", "t");
    title.appendChild(htm("span", null, SECTION_TITLES[section.name] || section.name));
    title.appendChild(htm("span", "n", section.processes.length));
    box.appendChild(title);
    if (!section.processes.length) {
      box.appendChild(htm("div", "empty", "none identified"));
    }
    for (const process of section.processes) {
      const row = htm("div", "proc");
      const line = htm("div");
      line.appendChild(htm("span", "n", process.label || process.id));
      if (process.importance && process.importance !== "unknown") {
        line.appendChild(htm("span", "imp", ` · ${process.importance}`));
      }
      row.appendChild(line);
      if (process.estimation) row.appendChild(htm("div", "est", process.estimation));
      for (const dataset of process.datasets || []) {
        const ds = htm("div", "ds", dataset.name);
        ds.appendChild(htm("span", "src", ` (${dataset.source})`));
        ds.title = dataset.path || dataset.name;
        row.appendChild(ds);
      }
      if (process.rationale) row.title = process.rationale;
      box.appendChild(row);
    }
    groups.appendChild(box);
  }
  parent.appendChild(groups);
}

function renderProgress() {
  const box = $("progress");
  box.textContent = "";
  renderSteps(box);
  renderProcesses(box);
}

/* ----------------------------------------------------------------- wiring */

$("save").addEventListener("click", save);
$("approve").addEventListener("click", approve);
$("cancel-run").addEventListener("click", cancelRun);
$("dock-grip").addEventListener("pointerdown", startDockResize);
$("dock-grip").addEventListener("dblclick", () => setDockHeight(DOCK_DEFAULT, true));
$("tab-progress").addEventListener("click", () => showTab("progress"));
$("tab-log").addEventListener("click", () => showTab("log"));
$("log-filter").addEventListener("change", applyLogFilter);
$("add-node").addEventListener("click", addNode);
$("add-condition").addEventListener("click", addCondition);
$("add-predefined").addEventListener("click", openLibrary);
$("library-close").addEventListener("click", closeLibrary);
$("library-search").addEventListener("input", (ev) => {
  libraryFilter = ev.target.value || "";
  renderLibrary();
});
$("relayout").addEventListener("click", relayout);
$("connect").addEventListener("click", () => {
  connecting = connecting ? null : "arm";
  $("connect").classList.toggle("on", !!connecting);
  toast(connecting ? "Click the upstream node, then the downstream one." : "Cancelled.");
});
$("show-prompt").addEventListener("click", () => {
  select("prompt", PROMPT_ID);
  scrollIntoView(promptPosition());
  $("side").scrollTop = 0;
});
/* Keep the drawing fitted to the pane. The window resizing is the common case;
   the observer catches the rest — the dock being dragged, the panel opening —
   which change the pane without changing the window. */
window.addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(refit).observe($("canvas-wrap"));

$("canvas-wrap").addEventListener("pointerdown", startPan);
$("canvas-wrap").addEventListener("click", () => {
  if (connecting) return;
  if (panned) { panned = false; return; }  // that click was the end of a pan
  sel = null; render(); renderSide();
});
window.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && connecting) {
    connecting = null; $("connect").classList.remove("on");
  }
  if (ev.key === "Escape" && !$("library").hidden) closeLibrary();
  if ((ev.metaKey || ev.ctrlKey) && ev.key === "s") { ev.preventDefault(); save(); }
});
window.addEventListener("beforeunload", (ev) => {
  if (dirty) { ev.preventDefault(); ev.returnValue = ""; }
});

setDockHeight(storedDockHeight() || DOCK_DEFAULT, false);
showTab(tab);   // explicit, so the page and its markup cannot disagree
load();
loadState();
// A run belongs to the analysis, not to this page: asking once on load is what
// lets a reload — or a second tab — pick up an analysis already in flight.
pollRun();
</script>
</body>
</html>
